name: Apaluu-INDODAX-ONLY

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Khusus Indodax
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          pip install requests -q
          python -c "
          import os, requests
          from datetime import datetime, timezone, timedelta
          TOKEN=os.getenv('TELEGRAM_TOKEN'); CHAT=os.getenv('CHAT_ID')
          WIB=datetime.now(timezone.utc)+timedelta(hours=7); JAM=WIB.strftime('%H:%M WIB')
          def kirim(t):
              requests.post(f'https://api.telegram.org/bot{TOKEN}/sendMessage', json={'chat_id':CHAT,'text':t,'parse_mode':'HTML'}, timeout=30)
          try:
              tick=requests.get('https://indodax.com/api/tickers', timeout=20).json()['tickers']
              cg=requests.get('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=volume_desc&per_page=250&page=1', timeout=30).json()
              cg_map={c['symbol'].upper(): c for c in cg}

              hasil=[]
              for pair, d in tick.items():
                  sym=pair.split('_')[0].upper()
                  c=cg_map.get(sym)
                  if not c: continue
                  mc=c.get('market_cap',0) or 0; vol=c.get('total_volume',0) or 0
                  if mc<3000000: continue
                  ratio=vol/mc*100 if mc>0 else 0
                  chg=c.get('price_change_percentage_24h',0) or 0
                  last=float(d['last'])

                  total = (25 if chg>5 else 10) + (25 if ratio>=80 else 15 if ratio>=50 else 0) + (20 if chg>8 else 10) + 20
                  if ratio>=40 and total>=55:
                      hasil.append((sym, last, ratio, chg, total))

              hasil=sorted(hasil, key=lambda x: x[2], reverse=True)[:8]
              if hasil:
                  txt=f'🔥 <b>KHUSUS INDODAX - {JAM}</b>\nRumus: Vol/MC + Skor 65-72\n\n'
                  for sym,last,ratio,chg,skor in hasil:
                      kat='🚀' if skor>=80 else '⚡' if skor>=65 else '👀'
                      txt+=f'{kat} <b>{sym}/IDR</b> Rp{last:,.0f}\nVol/MC {ratio:.1f}% | 24h {chg:.1f}% | Skor {skor}/100\n✅ INDODAX ONLY\n\n'
                  kirim(txt)
              else:
                  kirim(f'⏸️ {JAM} - Indodax sepi, Vol/MC <40% semua.')
          except Exception as e:
              kirim(f'Error {JAM}: {e}')
          "
