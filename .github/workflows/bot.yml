name:.github/workflows/bot.yml
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - name: Run V3 Early Break Bot
        run: |
          pip install requests -q
          python -c "
          import os, requests
          from datetime import datetime, timezone, timedelta
          TOKEN=os.getenv('TELEGRAM_TOKEN'); CHAT=os.getenv('CHAT_ID')
          WIB=datetime.now(timezone.utc)+timedelta(hours=7); JAM=WIB.strftime('%H:%M WIB')
          def kirim(t):
              requests.post(f'https://api.telegram.org/bot{TOKEN}/sendMessage', json={'chat_id':CHAT,'text':t,'parse_mode':'HTML'}, timeout=30)
          try:
              tick=requests.get('https://indodax.com/api/tickers', timeout=20).json()['tickers']
              cg=requests.get('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=volume_desc&per_page=250&page=1', timeout=30).json()
              cg_map={c['symbol'].upper(): c for c in cg}
              hasil=[]
              for pair, d in tick.items():
                  if not pair.endswith('_idr'): continue
                  sym=pair.split('_')[0].upper()
                  c=cg_map.get(sym)
                  if not c: continue
                  chg=c.get('price_change_percentage_24h',0) or 0
                  if chg < 0.5 or chg > 5.0: continue
                  mc=c.get('market_cap',0) or 0; vol=c.get('total_volume',0) or 0
                  if mc<3000000: continue
                  ratio=vol/mc*100 if mc>0 else 0
                  if ratio < 20 or ratio > 70: continue
                  last=float(d.get('last',0)); high=float(d.get('high',0))
                  if last < high*0.99: continue
                  hasil.append((sym,last,ratio,chg))
              hasil=sorted(hasil, key=lambda x: x[2], reverse=True)[:5]
              if hasil:
                  txt=f'🚀 <b>V3 EARLY BREAK - {JAM}</b>\nVol/MC 20-70% + Break High\n\n'
                  for sym,last,ratio,chg in hasil:
                      txt+=f'✅ <b>{sym}/IDR</b> Rp{last:,.0f}\nVol/MC {ratio:.1f}% | 24h +{chg:.1f}%\nCandle: BREAK HIGH 5m ✅\nENTRY CONFIRM!\n\n'
                  kirim(txt)
              else:
                  kirim(f'⏸️ {JAM} V3 - Ga ada yang Break High + Vol/MC 20-70%, bot DIAM.')
          except Exception as e:
              kirim(f'Error {JAM}: {e}')
          "
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}         
