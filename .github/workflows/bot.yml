
# BOT #140 V3 EARLY + BREAK - ANTI KETINGGALAN
name: BOT #140 V3 EARLY + BREAK
version: 3.0
exchange: indodax
interval: 1m

# STEP 1: FILTER PUMP AWAL
filters:
  vol_mc_24h:
    min: 20
    max: 70
  vol_mc_1h:
    min: 5
  price_15m:
    min: 0.8
    max: 2.5
  price_24h:
    min: 0.5
    max: 5.0
  score_min: 85
  market_cap_min: 3000000

# STEP 2: AUTO CANDLE CONFIRM (GABUNGAN 1,2,3)
candle_confirm:
  timeframe: 5m
  logic: ANY
  conditions:
        - name: BREAK_HIGH_VOL
      type: breakout
      close_5m_gt_high_15m: true
      volume_5m_gt: 2x SMA20
        - name: ENGULFING
      type: bullish_engulfing
      close_gt_open: true
      body_gt_prev: 1.2
        - name: BB_BOUNCE
      type: bb_bounce
      prev_close_lt_mid_bb: true
      curr_close_gt_mid_bb: true
      volume_bullish: true

# OUTPUT TELEGRAM
telegram:
  enabled: true
  template: "🚀 {SYMBOL}/IDR {PRICE} {CANDLE_TYPE} VOL x{vol_mult}\nVol/MC {vol_mc}% | 15m +{p15m}% | 24h +{p24h}% | Skor {score}\nCandle: {candle_desc}\nENTRY CONFIRM!"

skip_log:
    - ASETQU 92% -> SKIP >70%
    - ZORA +0.2% -> SKIP 15m          
