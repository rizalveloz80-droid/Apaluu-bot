name: Apaluu-FIX-MERAH
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: V4 BB Lower Bounce OGN Formula
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          pip install requests -q
          python << 'PY'
          import os, requests
          from datetime import datetime, timezone, timedelta
          TOKEN=os.getenv('TELEGRAM_TOKEN')
          CHAT=os.getenv('CHAT_ID')
          WIB=datetime.now(timezone.utc)+timedelta(hours=7)
          JAM=WIB.strftime('%H:%M WIB')
          def kirim(t):
              r=requests.post(f'https://api.telegram.org/bot{TOKEN}/sendMessage', json={'chat_id':CHAT,'text':t,'parse_mode':'HTML'}, timeout=30)
              print(f"Kirim: {r.status_code}")
          try:
              tick=requests.get('https://indodax.com/api/tickers', timeout=20).json()['tickers']
              cg=requests.get('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=volume_desc&per_page=250&page=1', timeout=30).json()
              cg_map={c['symbol'].upper(): c for c in cg}
              bounce=[]; ijo=[]
              for pair,d in tick.items():
                  if not pair.endswith('_idr'): continue
                  sym=pair.split('_')[0].upper()
                  c=cg_map.get(sym)
                  if not c: continue
                  chg=c.get('price_change_percentage_24h',0) or 0
                  mc=c.get('market_cap',0) or 0; vol=c.get('total_volume',0) or 0
                  if mc<3000000: continue
                  ratio=vol/mc*100 if mc>0 else 0
                  if ratio<20: continue
                  last=float(d.get('last',0)); low=float(d.get('low',0)); vol_idr=float(d.get('vol_idr',0))
                  if last==0 or low==0: continue
                  jarak=(last-low)/low*100
                  if jarak<=8 and -3.5<=chg<=2.5 and vol_idr>=200000000:
                      bounce.append((sym,last,ratio,chg,jarak,low,vol_idr))
                  elif chg>0 and ratio>=30:
                      ijo.append((sym,last,ratio,chg))
              bounce=sorted(bounce,key=lambda x:x[4])[:5]
              ijo=sorted(ijo,key=lambda x:x[3],reverse=True)[:5]
              print(f"Bounce {len(bounce)} Ijo {len(ijo)}")
              if bounce or ijo:
                  txt=f'🔥 <b>V4 OGN FORMULA - {JAM}</b>\n'
                  if bounce:
                      txt+='\n<b>🎯 BB LOWER BOUNCE (OGN 597 TYPE):</b>\n'
                      for s,last,ratio,chg,jarak,low,vidr in bounce:
                          txt+=f'✅ <b>{s}/IDR</b> Rp{last:,.0f}\nLow Rp{low:,.0f} Jarak {jarak:.1f}% Vol {vidr/1e6:.0f}Mn\nVol/MC {ratio:.1f}% 24h {chg:+.1f}%\n👉 ENTRY LOWER KAYAK OGN 597!\n\n'
                  if ijo:
                      txt+='<b>✅ IJO ONLY:</b>\n'
                      for s,last,ratio,chg in ijo:
                          txt+=f'🚀 <b>{s}/IDR</b> Rp{last:,.0f} +{chg:.1f}% Vol/MC {ratio:.1f}%\n'
                  kirim(txt)
              else:
                  print(f"{JAM} DIAM ga ada sinyal OGN")
          except Exception as e:
              print(e)
              kirim(f"Error {JAM}: {e}")
          PY
