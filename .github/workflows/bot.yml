name: Apaluu-FIX-MERAH

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Hanya Ijo
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          pip install requests -q
          python -c "
          import os, requests
          from datetime import datetime, timezone, timedelta
          TOKEN=os.getenv('TELEGRAM_TOKEN'); CHAT=os.getenv('CHAT_ID')
          WIB=datetime.now(timezone.utc)+timedelta(hours=7); JAM=WIB.strftime('%H:%M WIB')
          def kirim(t):
              requests.post(f'https://api.telegram.org/bot{TOKEN}/sendMessage', json={'chat_id':CHAT,'text':t,'parse_mode':'HTML'}, timeout=30)
          try:
              tick=requests.get('https://indodax.com/api/tickers', timeout=20).json()['tickers']
              cg=requests.get('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=volume_desc&per_page=250&page=1', timeout=30).json()
              cg_map={c['symbol'].upper(): c for c in cg}
              hasil=[]
              for pair, d in tick.items():
                  if not pair.endswith('_idr'): continue
                  sym=pair.split('_')[0].upper()
                  c=cg_map.get(sym)
                  if not c: continue
                  chg=c.get('price_change_percentage_24h',0) or 0
                  # KUNCI ANTI MINUS: CUMA AMBIL YANG IJO >0%!!!!
                  if chg <= 0:
                      continue
                  mc=c.get('market_cap',0) or 0; vol=c.get('total_volume',0) or 0
                  if mc<3000000: continue
                  ratio=vol/mc*100 if mc>0 else 0
                  last=float(d.get('last',0))
                  skor = (25 if chg>10 else 20) + (25 if ratio>80 else 15) + 20 + 15 + 15
                  if ratio>=30:
                      hasil.append((sym,last,ratio,chg,skor))
              hasil=sorted(hasil, key=lambda x: x[3], reverse=True)[:6]
              if hasil:
                  txt=f'✅ <b>INDODAX IJO ONLY - {JAM}</b>\nCuma 24h >0% (Anti CTSI/PIXEL)\n\n'
                  for sym,last,ratio,chg,skor in hasil:
                      txt+=f'🚀 <b>{sym}/IDR</b> Rp{last:,.0f}\nVol/MC {ratio:.1f}% | 24h +{chg:.1f}% | Skor {skor}/100\n✅ INDODAX IJO\n\n'
                  kirim(txt)
              else:
                  kirim(f'⏸️ {JAM} - Semua Indodax merah, bot DIAM ga ngasih sinyal biar ga minus kayak CTSI/PIXEL.')
          except Exception as e:
              kirim(f'Error {JAM}: {e}')
          "
          
