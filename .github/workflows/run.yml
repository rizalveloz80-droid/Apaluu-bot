name: bot

on:
  schedule:
    - cron: '*/3 * * * *' # Berjalan otomatis setiap 3 menit sekali
  workflow_dispatch: # Tombol pemicu manual

jobs:
  build:
    runs-runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Requests Dependency
        run: pip install requests

      # === VERSI AMAN: MENGGUNAKAN TAG RILIS v1.4 YANG PASTI ADA DI REPO ===
      - name: Setup Cloudflare WARP Tunnel
        uses: fscarmen/warp-on-actions@v1.4
        with:
          stack: dual
          mode: client

      # === EKSEKUSI SCRIPT SCANNER ===
      - name: Run bot
        env:
          TELE_TOKEN: ${{ secrets.TELE_TOKEN }}
          TELE_CHAT_ID: ${{ secrets.TELE_CHAT_ID }}
        run: python main.py
