      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # === LANGKAH BARU: PASANG VPN CLOUDFLARE WARP UNTUK JEBOL BAN IP ===
      - name: Install and Start Cloudflare WARP
        uses: fscarmen/warp-on-actions@v1.1.0
        with:
          mode: proxy # Mengaktifkan mode proxy lokal yang super aman

      # === EKSEKUSI BOT SEPERTI BIASA ===
      - name: Run bot
        env:
          TELE_TOKEN: ${{ secrets.TELE_TOKEN }}
          TELE_CHAT_ID: ${{ secrets.TELE_CHAT_ID }}
        run: |
          python main.py
