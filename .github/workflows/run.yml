name: Apaluu V27 Loose
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Load price cache
        uses: actions/cache@v3
        with:
          path: price_cache.json
          key: price-cache-v27
          restore-keys: price-cache-
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - run: pip install -r requirements.txt
      - name: Run bot
        env:
          TELE_TOKEN: ${{ secrets.TELE_TOKEN }}
          TELE_CHAT_ID: ${{ secrets.TELE_CHAT_ID }}
        run: python main.py
