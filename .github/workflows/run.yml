name: V9.1 EARLY 3M Memory

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install requests pytz

      - name: Run Bot V9.1
        env:
          TELE_TOKEN: ${{ secrets.TELE_TOKEN }}
          TELE_CHAT_ID: ${{ secrets.TELE_CHAT_ID }}
        run: python main.py

      - name: Save Memory
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@bot.com"
          git add price_memory.json || true
          git commit -m "update memory" || true
          git push || true
