name: V25 SPIKE 5MENIT + BANDAR 6JAM

on:
  workflow_dispatch:

# BIAR GAK NUMPUK! Kalo ada run baru, run lama otomatis di-cancel!
concurrency:
  group: bot-v25
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install requests pytz

      - name: Run Bot V25 Spike 5Menit
        env:
          TELE_TOKEN: ${{ secrets.TELE_TOKEN }}
          TELE_CHAT_ID: ${{ secrets.TELE_CHAT_ID }}
        run: python main.py

      - name: Simpan Vol History 6 Jam + Price 5 Menit
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add vol_history.json price_history.json
          git commit -m "vol 6jam + price 5menit" || true
          git push || true
