name: bot

on:
  schedule:
        - cron: '*/5 * * * *'  # <-- INI KUNCINYA! 5 MENIT SEKALI!
  workflow_dispatch:       # biar bisa pencet Run bot manual

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
            - uses: actions/checkout@v3
            - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
            - name: Install requests
        run: pip install requests
            - name: Run bot
        env:
          TELE_TOKEN: ${{ secrets.TELE_TOKEN }}
          TELE_CHAT_ID: ${{ secrets.TELE_CHAT_ID }}
        run: python main.py
