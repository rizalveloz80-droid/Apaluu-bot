name: bot

on:
  schedule:
    - cron: '*/3 * * * *' # Berjalan otomatis setiap 3 menit sekali
  workflow_dispatch: # Supaya tombol "Run workflow" manual tetap ada

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Requests Dependency
        run: pip install requests

      # === FIX VERSI WARP: MENGGUNAKAN VERSI UTAMA YANG PASTI TERSEDIA ===
      - name: Setup Cloudflare WARP Tunnel
        uses: fscarmen/warp-on-actions@main
        with:
          mode: proxy

      # === EKSEKUSI SCRIPT SCANNER ===
      - name: Run bot
        env:
          TELE_TOKEN: ${{ secrets.TELE_TOKEN }}
          TELE_CHAT_ID: ${{ secrets.TELE_CHAT_ID }}
        run: python main.py
