# V10 LOOSE V27.0 - FIX 4 MASALAH + LONGGAR
# Dibikin ulang 17 Oct 2026 jam 10.10

version: "V27.0_LOOSE"
description: "Loose version - anti miss koin running"

# === KUOTA RANK - UDAH GUE BUKA LAGI BIAR GA KELEWAT ===
counts:
  GOLD_COUNT: 2
  SILVER_COUNT: 3
  BRONZE_COUNT: 3      # TADI 0 SEKARANG 3 - BIAR GAINERS KETANGKEP!
  GAINERS_COUNT: 3     # TADI 0 SEKARANG 3 - BIAR BREAKOUT KETANGKEP!
  PRE_TRENDING_COUNT: 4  # DARI 2 JADI 4 - BIAR VARIASI!
  SEROK_DALEM_COUNT: 5
  SEROK_TIPIS_COUNT: 3

# === SMART CANDLE FILTER - VERSI LONGGAR ===
filters:
  # GOLD - KOIN UDAH RUNNING
  GOLD:
    dl: [0, 10]          # low diff 0-10%
    sq: [0, 15]          # squeeze <15%
    chg: [-5, 20]        # chg -5% sampe +20% (biar yang +10% ke tangkep)
    vol_min: 10_000_000
    vol_max: 10_000_000_000  # HAPUS BATAS 250JT! SAMPE 10M JUGA MASUK!

  # SILVER - EARLY RUNNING
  SILVER:
    dl: [0, 12]
    sq: [0, 18]
    chg: [-10, 15]
    vol_min: 10_000_000
    vol_max: 10_000_000_000

  # PRE_TRENDING - CALON TIA KMNO - VERSI LONGGAR!
  PRE_TRENDING:
    dl: [0, 6.5]         # DARI 5.5 JADI 6.5 - LONGGAR DIKIT
    sq: [0, 14]          # DARI 12 JADI 14 - LONGGAR DIKIT
    chg: [-20, 6]        # DARI 4 JADI 6 - BIAR YANG UDAH +5% MASUK!
    vol_min: 10_000_000
    vol_max: 2_000_000_000  # DARI 250JT JADI 2 MILIAR! BIAR VOL 300JT GA HILANG!

  # SEROK_DALEM
  SEROK_DALEM:
    dl: [0, 3.5]
    sq: [0, 20]
    chg: [-20, -0.2]
    vol_min: 10_000_000
    vol_max: 10_000_000_000

# === FIX SHUFFLE & CHG 15M ===
logic:
  shuffle: false         # MATIIN RANDOM.SHUFFLE! GANTI SORT BY VOL!
  sort_by: "vol"         # URUTKAN BERDASARKAN VOLUME TERBESAR!
  # sort_by: "volume_velocity"  # KALO UDAH ADA CACHE VOL 15M

  chg_short:
    enabled: true
    cache_file: "price_cache.json"
    # Kalo chg 24j minus tapi chg_15m > 3% = pindah ke GOLD
    running_threshold_15m: 3.0
    early_threshold_15m: 1.5

# === CONTOH HASIL NANTI ===
# PRE_TRENDING bakal muncul 4 koin:
# BEAT -2.9% sq 4% 228jt
# IO -1.1% sq 5% 224jt
# LIGHTER 2.7% sq 10% 150jt (baru masuk karena chg max 6%)
# UB 4.5% sq 12% 180jt (baru masuk)
