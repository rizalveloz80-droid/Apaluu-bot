name: Indodax Live Pump Bot

on:
  schedule:
    # Otomatis berjalan setiap 5 menit sekali
    - cron: '*/5 * * * *'
  workflow_dispatch: # Tombol manual run di web GitHub tetap aktif

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Crypto Scanner Bot
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python main.py

    # Otomatis menyimpan file riwayat harga untuk pendeteksian di menit ke depan
    - name: Commit and Push Price History
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        git add price_history.json || true
        git commit -m "🔄 Update live price history [skip ci]" || true
        git push || true
